# Builds, signs and publishes a release when a version tag (v1.2, v1.2.1, …) is pushed.
# The APK gets a signed build-provenance attestation, so anyone can check that it was
# built here from this repository's source:  gh attestation verify AltiKit-<version>.apk --repo Bot320/AltiKit
# Setup and the release steps are in docs/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write          # create the GitHub Release
      id-token: write          # get the OIDC token that signs the attestation
      attestations: write      # store the attestation
      artifact-metadata: write
    env:
      # SHA-256 of the AltiKit release signing certificate (also listed in the README).
      EXPECTED_CERT_SHA256: 1f8eccca0a88f8ecede753063c1248f440f1b55be1ff176cce702dbb780039a6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName \"$version\" in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # Also validates the Gradle wrapper JAR against Gradle's published checksums.
      # Caching is off so a release never builds from a cache another run wrote.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ALTIKIT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ALTIKIT_KEYSTORE_BASE64 is not set (see docs/RELEASING.md)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ALTIKIT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          ALTIKIT_KEYSTORE_PASSWORD: ${{ secrets.ALTIKIT_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the signing certificate
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          if ! grep -q "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" certs.txt; then
            echo "::error::The APK is not signed with the AltiKit release key"
            exit 1
          fi

      - name: Collect release files
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AltiKit-$VERSION.apk"
          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/AltiKit-*.apk

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AltiKit $VERSION" \
            --generate-notes \
            --verify-tag
